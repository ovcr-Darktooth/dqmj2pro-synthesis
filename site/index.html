<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthèses DQMJ2 Pro</title>
  <meta name="description" content="Toutes les synthèses de Dragon Quest Monsters: Joker 2 Professional, avec les icônes des monstres.">
  <link rel="icon" href="icons/1.png">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="top">
    <a class="brand" href="#">
      <img src="icons/1.png" alt="" width="40" height="40">
      <span data-i18n="title">Synthèses DQMJ2 Pro</span>
    </a>
    <div class="settings">
      <div class="seg" role="group" aria-label="ROM" id="rom-toggle">
        <button type="button" data-rom="original" data-i18n="romOriginal">ROM originale</button>
        <button type="button" data-rom="patch" data-i18n="romPatch">ROM patchée</button>
      </div>
      <div class="seg" role="group" aria-label="Langue" id="lang-toggle">
        <button type="button" data-lang="fr" title="Français" aria-label="Français"><svg class="flag" viewBox="0 0 3 2" aria-hidden="true"><path fill="#002395" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ed2939" d="M2 0h1v2H2z"/></svg></button>
        <button type="button" data-lang="en" title="English" aria-label="English"><svg class="flag" viewBox="0 0 60 30" aria-hidden="true"><clipPath id="gb-c"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#gb-c)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
      </div>
    </div>
  </header>

  <main>
    <nav class="tabs">
      <button type="button" data-view="recipes" data-i18n="tabRecipes">Recettes</button>
      <button type="button" data-view="monsters" data-i18n="tabMonsters">Monstres</button>
      <button type="button" data-view="tree" data-i18n="tabTree">Arbre</button>
    </nav>

    <section class="window filters">
      <input type="search" id="search" autocomplete="off" data-i18n-placeholder="search">
      <div class="chips" id="rank-chips"></div>
      <div class="chips" id="family-chips"></div>
      <p class="count" id="count"></p>
    </section>

    <section id="list"></section>

    <section id="tree" hidden>
      <div class="window filters">
        <input type="search" id="tree-search" autocomplete="off" data-i18n-placeholder="treeSearch">
        <div class="t-picker" id="tree-picker"></div>
      </div>
      <div id="tree-body"></div>
    </section>
  </main>

  <dialog id="detail"></dialog>

  <footer>
    <span data-i18n="footer"></span>
    <a href="https://github.com/p0chilla/DQMJ2Pro_Translation_FR">DQMJ2Pro_Translation_FR</a>
  </footer>

  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
